name: Rapport SEO mensuel (client)

# Génère le rapport SEO/GEO du château et le publie sur GitHub Pages.
# Le 3 de chaque mois à 06:00 UTC, ou à la demande (workflow_dispatch).

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write # committer reporting/history.json
  pages: write # déployer sur Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le rapport
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node reporting/generate-report.mjs

      - name: Historiser (commit history.json)
        run: |
          git config user.name "huberdiere-report-bot"
          git config user.email "bot@chateaudelahuberdiere.com"
          git add reporting/history.json
          git commit -m "chore(report): historique $(date +%Y-%m)" || echo "rien à committer"
          git push || echo "push impossible (historique non persisté ce mois-ci)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reporting/dist

      - id: deploy
        uses: actions/deploy-pages@v4
