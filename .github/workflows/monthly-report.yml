name: Rapport SEO mensuel (client)

# Génère le rapport SEO/GEO du château et le publie sur GitHub Pages.
# Le 3 de chaque mois à 06:00 UTC, à la demande, ou quand le générateur change.

on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "reporting/**"
      - ".github/workflows/monthly-report.yml"

permissions:
  contents: write # committer reporting/history.json
  pages: write # déployer sur Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le rapport
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node reporting/generate-report.mjs

      - name: Historiser (commit history.json)
        run: |
          git config user.name "huberdiere-report-bot"
          git config user.email "bot@chateaudelahuberdiere.com"
          git add reporting/history.json
          git commit -m "chore(report): historique $(date +%Y-%m)" || echo "rien à committer"
          git push || echo "push impossible (historique non persisté ce mois-ci)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: reporting/dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Notifier le lien par email (Brevo)
        if: success()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_TO: ${{ vars.REPORT_EMAIL_TO }}
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then echo "Pas de BREVO_API_KEY, notification ignorée."; exit 0; fi
          TO="${REPORT_TO:-alexis@morain.fr}"
          HTML="<p>Le nouveau rapport SEO du Château de la Huberdière est en ligne :</p><p><a href=\"$URL\">$URL</a></p><p>Prêt à transférer au client.</p>"
          PAYLOAD=$(jq -n --arg to "$TO" --arg html "$HTML" \
            '{sender:{email:"alexis@morain.fr",name:"Reporting Huberdière"},to:[{email:$to}],subject:"Rapport SEO Huberdière — nouveau mois en ligne",htmlContent:$html}')
          curl -sS -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: $BREVO_API_KEY" -H "content-type: application/json" -d "$PAYLOAD"
          echo "Notification envoyée à $TO."
